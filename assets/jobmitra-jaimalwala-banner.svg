<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
<title id="title">India Job Desk</title><desc id="desc">ਸਤਿਨਾਮ ਸ੍ਰੀ ਵਾਹਿਗੁਰੂ, ੴ, ॐ नमः शिवाय and India Job Desk jobs portal banner.</desc>
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#061b55"/><stop offset=".55" stop-color="#0c4eae"/><stop offset="1" stop-color="#071a50"/></linearGradient>
 <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#fff4a6"/><stop offset=".5" stop-color="#ffc72e"/><stop offset="1" stop-color="#d98700"/></linearGradient>
 <linearGradient id="white" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#dceaff"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur in="SourceAlpha" stdDeviation="7"/><feOffset dy="5"/><feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="500" rx="28" fill="url(#bg)"/>
<path d="M0 0H1600V12Q1200 95 800 45Q400 0 0 100Z" fill="#1c6dd8" opacity=".35"/>
<circle cx="800" cy="220" r="250" fill="none" stroke="#ffc83d" stroke-width="3" opacity=".18"/>
<path d="M0 150Q400 75 800 130T1600 115" fill="none" stroke="#65b8ff" stroke-width="2" opacity=".3"/>
<g font-family="'Noto Sans Gurmukhi',sans-serif" fill="url(#gold)" font-weight="700" filter="url(#shadow)">
 <text x="55" y="88" font-size="48" letter-spacing="1.2">ਸਤਿਨਾਮ  ਸ੍ਰੀ  ਵਾਹਿਗੁਰੂ</text>
 <text x="1545" y="88" font-size="48" text-anchor="end">ॐ नमः शिवाय</text>
</g>
<g filter="url(#shadow)">
