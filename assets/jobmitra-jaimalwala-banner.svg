<g text-anchor="middle" filter="url(#shadow)">
 <text x="800" y="300" font-family="Arial,sans-serif" font-size="125" font-weight="900" letter-spacing="-5" fill="url(#white)" stroke="#06275f" stroke-width="9" paint-order="stroke">India <tspan fill="#ffc629">Job Desk</tspan></text>
 <path d="M300 325Q800 385 1300 325L1250 405H350Z" fill="#073c9c" stroke="url(#gold)" stroke-width="6"/>
 <text x="800" y="392" font-family="Arial,sans-serif" font-size="48" font-weight="900" fill="url(#white)" stroke="#061e5b" stroke-width="3" paint-order="stroke">ਤੁਹਾਡੀ ਮਿਹਨਤ, ਤੁਹਾਡੀ ਮੰਜ਼ਿਲ</text>
 <text x="800" y="458" font-family="Arial,sans-serif" font-size="27" font-weight="700" letter-spacing="2" fill="#ffdf64">YOUR DREAM • YOUR CAREER • YOUR FUTURE</text>
</g>
