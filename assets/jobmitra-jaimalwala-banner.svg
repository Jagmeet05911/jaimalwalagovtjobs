 <text x="735" y="86" text-anchor="middle" font-family="serif" font-size="33" font-weight="bold" fill="url(#gold)">ੴ</text>
 <circle cx="865" cy="75" r="29" fill="#fff4c7" stroke="#e9a900" stroke-width="3"/><circle cx="865" cy="75" r="24" fill="#143b91"/>
