
name: Daily Government Job Check

on:
  push:
    paths:
      - "scripts/fetch_jobs.py"
      - ".github/workflows/job-check.yml"
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Collect job candidates
        run: python scripts/fetch_jobs.py

      - name: Save pending candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pending_jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Update pending job candidates"
            git push
          fi
