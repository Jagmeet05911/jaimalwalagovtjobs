name: Discover official job notice candidates

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    paths:
      - ".github/scripts/discover_jobs.py"
      - ".github/workflows/discover-jobs.yml"

permissions:
  contents: write

concurrency:
  group: job-discovery
  cancel-in-progress: true

jobs:
  discover:
    name: Scan official job sources
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Discover government and private job candidates
        run: python .github/scripts/discover_jobs.py

      - name: Save updated candidate list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pending_jobs.json
          if git diff --cached --quiet; then
            echo "No new job candidates found."
            exit 0
          fi
          git commit -m "Refresh job candidates"
          git pull --rebase origin main
          git push origin HEAD:main
