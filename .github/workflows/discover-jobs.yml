name: Discover official job notice candidates

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
  push:
    paths:
      - ".github/scripts/discover_jobs.py"
      - ".github/workflows/discover-jobs.yml"

permissions:
  contents: write

concurrency:
  group: job-discovery
  cancel-in-progress: true

jobs:
  discover:
    name: Scan official job sources
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Discover government and private job candidates
        run: python .github/scripts/discover_jobs.py

      - name: Save updated candidate list
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp data/pending_jobs.json /tmp/pending_jobs_scanned.json

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/pending_jobs_scanned.json data/pending_jobs.json
            git add data/pending_jobs.json

            if git diff --cached --quiet; then
              echo "Candidate list is already up to date."
              exit 0
            fi

            git commit -m "Refresh job candidates"
            if git push origin HEAD:main; then
              echo "Candidate list saved successfully."
              exit 0
            fi

            echo "Push attempt $attempt failed; retrying after syncing main."
          done

          echo "Could not save candidate list after 3 attempts."
          exit 1
