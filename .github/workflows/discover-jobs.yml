name: Discover official job notice candidates

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"
  push:
    paths:
      - ".github/scripts/discover_jobs.py"
      - ".github/workflows/discover-jobs.yml"

permissions:
  contents: write

concurrency:
  group: job-discovery
  cancel-in-progress: true

jobs:
  discover:
    name: Scan official job sources
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Discover government and private job candidates
        run: python .github/scripts/discover_jobs.py

      - name: Clean duplicate and stale candidates
        run: |
          python - <<'PY'
          import json
          import re
          from datetime import date, datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          path = Path("data/pending_jobs.json")
          items = json.loads(path.read_text(encoding="utf-8")) if path.exists() else []
          today = datetime.now(ZoneInfo("Asia/Kolkata")).date()
          cleaned = []
          seen = set()
          for item in items:
              if not isinstance(item, dict):
                  continue
              title = str(item.get("title", "")).strip()
              url = str(item.get("url", "")).strip()
              key = url or re.sub(r"\s+", " ", title).lower()
              if not key or key in seen:
                  continue
              # Require a recent source check before a candidate can remain in the feed.
              try:
                  checked = datetime.strptime(str(item.get("sourceChecked", "")), "%Y-%m-%d").date()
              except ValueError:
                  continue
              if checked > today or (today - checked).days > 7:
                  continue
              # Drop notices explicitly tied to a previous calendar-year cycle.
              years = [int(y) for y in re.findall(r"\b(20\d{2})\b", title)]
              if years and max(years) < today.year:
                  continue
              deadline = str(item.get("deadline", "")).strip()
              if deadline:
                  parsed = None
                  for fmt in ("%Y-%m-%d", "%d-%m-%Y", "%d/%m/%Y", "%d.%m.%Y"):
                      try:
                          parsed = datetime.strptime(deadline[:10], fmt).date()
                          break
                      except ValueError:
                          pass
                  if parsed and parsed < today:
                      continue
              seen.add(key)
              cleaned.append(item)
          path.write_text(json.dumps(cleaned, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Cleaned candidates: {len(items)} -> {len(cleaned)}")
          PY

      - name: Save updated candidate state
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/pending_jobs.json /tmp/pending_jobs_scanned.json
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/pending_jobs_scanned.json data/pending_jobs.json
            git add data/pending_jobs.json
            if git diff --cached --quiet; then echo "Candidate list is already up to date."; exit 0; fi
            git commit -m "Refresh government job candidates for admin review"
            if git push origin HEAD:main; then echo "Candidate list saved successfully."; exit 0; fi
            echo "Push attempt $attempt failed; retrying after syncing main."
          done
          echo "Could not save candidate list after 3 attempts."
          exit 1
