name: Apply navigation layout

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-nav-layout.yml"

permissions:
  contents: write

jobs:
  update-nav:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Put Home button on its own row
        run: |
          cat >> style.css <<'EOF'

/* Navigation layout: Home is kept alone on the row below the main buttons. */
.tabs{flex-wrap:wrap;align-items:center}
.tabs #homeTab{order:99;flex:0 0 auto;margin-top:2px}
EOF

      - name: Commit navigation update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css
          if git diff --cached --quiet; then
            echo "Navigation layout already applied."
          else
            git commit -m "Move Home navigation below main tabs"
            git pull --rebase origin main
            git push
          fi

      - name: Remove one-time workflow
        run: |
          rm -f .github/workflows/apply-nav-layout.yml
          git add .github/workflows/apply-nav-layout.yml
          git commit -m "Remove one-time navigation workflow"
          git push
