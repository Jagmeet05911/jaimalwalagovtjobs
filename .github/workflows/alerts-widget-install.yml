name: Install visitor job alert widget

on:
  push:
    paths:
      - "alerts.js"
      - ".github/workflows/alerts-widget-install.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Add alert widget script to the site
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          tag = '<script src="alerts.js?v=20261025" defer></script>'
          if "alerts.js" not in text:
              marker = "</body>"
              if marker not in text:
                  raise SystemExit("Could not find </body> in index.html")
              text = text.replace(marker, f"  {tag}\n{marker}", 1)
              path.write_text(text, encoding="utf-8")
              print("Visitor job alert widget installed.")
          else:
              print("Visitor job alert widget already installed.")
          PY

      - name: Commit widget installation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No installation changes needed."
            exit 0
          fi
          git commit -m "Add visitor job alert signup to website"
          git push origin HEAD:main
